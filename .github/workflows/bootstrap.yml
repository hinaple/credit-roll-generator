name: Bootstrap source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4

      - name: Restore project source
        run: |
          cat .bootstrap/chunk* | base64 -d > /tmp/credit-generator-source.tar.gz
          tar -xzf /tmp/credit-generator-source.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit restored source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: migrate credit generator to Svelte 5 and add image assets"
          git push origin HEAD:main
